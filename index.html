<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arya — Voice Demo</title>
<style>
  :root { --bg:#0b0f17; --panel:#141a26; --line:#243045; --text:#e6edf7; --dim:#8a97ad; --acc:#ff8a1f; --ok:#3ecf8e; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; } h1 span { color:var(--acc); }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 14px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { flex:1; border:0; border-radius:0; padding:12px; background:var(--panel); }
  .seg button.on { background:var(--acc); color:#000; font-weight:600; }
  #talk { align-self:center; width:180px; height:180px; border-radius:50%; font-size:18px; font-weight:600;
          border:3px solid var(--line); background:var(--panel); touch-action:none; user-select:none;
          -webkit-user-select:none; -webkit-touch-callout:none; transition:all .15s; }
  #talk.listening { border-color:var(--acc); background:#2a1a08; box-shadow:0 0 30px #ff8a1f55; }
  #talk.thinking { border-color:#6aa3ff; } #talk.speaking { border-color:var(--ok); }
  #status { text-align:center; color:var(--dim); min-height:1.4em; } #status.err { color:var(--err); }
  .meter { height:6px; background:var(--panel); border-radius:3px; overflow:hidden; position:relative; }
  .meter i { position:absolute; inset:0 auto 0 0; width:0; background:var(--ok); }
  .meter b { position:absolute; top:0; bottom:0; width:2px; background:var(--acc); }
  .hudbar { display:flex; justify-content:space-between; align-items:center; color:var(--dim); font-size:13px; }
  #hud { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; font-variant-numeric:tabular-nums; }
  #hud div { display:flex; flex-direction:column; } #hud span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  #hud b { font-weight:600; font-size:14px; } #hud b.ok { color:var(--ok); } #hud b.warn { color:var(--acc); }
  #log { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; overflow-y:auto; min-height:200px; }
  .msg { margin:0 0 10px; } .msg .who { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .msg.arya .who { color:var(--acc); } .msg .t { white-space:pre-wrap; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  summary { cursor:pointer; color:var(--dim); }
  label { display:block; margin-top:10px; font-size:13px; color:var(--dim); }
  input, select, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:4px; }

</style>

<body>
<main>
  <header><h1><span>ARYA</span> voice demo</h1><div><button id="test">Test</button> <button id="clear">Clear</button></div></header>

  <div class="seg" id="mode">
    <button data-mode="ptt">Push to talk</button>
    <button data-mode="always">Always listening</button>
  </div>

  <button id="talk">Tap to start</button>
  <div id="status">Open Settings, enter both API keys, then tap the button.</div>
  <div class="meter" title="Mic level / voice threshold"><i id="lvl"></i><b id="thr"></b></div>

  <div class="hudbar"><span>Live console (simulated)</span><button id="simRestart">Restart sim</button></div>
  <div id="hud"></div>
  <div id="log"></div>

  <details id="settings">
    <summary>Settings</summary>
    <label>Cartesia API key<input id="cKey" type="password" autocomplete="off" placeholder="sk_car_..."></label>
    <label>Anthropic API key<input id="aKey" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
    <label>Claude model
      <select id="model">
        <option value="claude-haiku-5-5">claude-haiku-5-5 (fastest)</option>
        <option value="claude-sonnet-5-5">claude-sonnet-5-5</option>
        <option value="claude-opus-5-5">claude-opus-5-5</option>
      </select></label>
    <label>Sonic voice ID (Indian-accent English)<input id="voice" autocomplete="off"></label>
    <div class="hint">Default: Aarti (Indian-accent female). Pick any voice ID from play.cartesia.ai and paste it here.</div>
    <label>Voice threshold (always-listening mode)<input id="sens" type="range" min="0.002" max="0.08" step="0.001"></label>
    <label>Silence before end of turn (ms)<input id="silence" type="number" min="300" max="3000" step="100"></label>
    <label>Arya system prompt<textarea id="prompt"></textarea></label>
    <div class="row"><button id="resetPrompt">Reset prompt to default</button></div>
    <div class="hint">Keys are saved only in this browser (localStorage). Nothing is stored in the page code.</div>
  </details>
</main>

<script type="text/plain" id="aryaDefault"># Arya: the crew console's voice assistant

You are **Arya**, the voice assistant of the crew display console in the HLVM3 crew module. The crew talk to you while they work, and you answer by voice.

## Language
- Answer in the language of the crew member's latest request: Hindi → answer in Hindi, English → answer in English. Switch automatically every turn; never refuse a language switch.
- Write Hindi in Devanagari script. Keep technical words that crews say in English (oxygen, altitude, ground station, console) in English, as Hinglish speakers do.
- Any other language → answer in English.
- You are female: in Hindi use feminine forms ("मैं बता सकती हूँ").
- Your name may be transcribed as "Arya", "आर्या" or "आरिया".

## When to speak
- Answer only when someone speaks **to you**: they say "Arya", or they go on with a request they just made to you.
- Speech between people (crew to crew, or crew to someone on a video call) is **not for you**: reply with only "..." and do nothing.
- If you are not sure it was meant for you, reply with only "...".

## What you help with
Only the console and the mission:
- the mission: phase, mission elapsed time, orbit, next events, ground-station passes
- the cabin environment, cautions and warnings, the console computer
- the cabin lights, the camera view, video calls

For anything else, decline in one short sentence: "I can only help with the console and the mission." (in Hindi: "मैं केवल कंसोल और मिशन में मदद कर सकती हूँ।")

## How to answer
- Keep it short and spoken: one or two sentences. Use no lists and no markdown, and read no symbols aloud.
- Give numbers with their units, rounded to what matters: "cabin temperature 22 degrees", "altitude 418 kilometres".
- Give times in hours and minutes ("in 1 hour 12 minutes"), never in raw seconds.
- For simulated data (the cabin environment, the radio figures), say "simulated" once.
- Say the console's values as they are; never work them out yourself.

## Using the console tools
- Use the Console Telemetry tools for every answer about the console or the mission; never guess.
- To change something (lights, cameras, calls), call the tool straight away; it reads the console itself.
- Before you **call** someone, **hang up**, **end all calls** or **reject** a call, say who and wait for a "yes".
- If a tool answers done false, say what did not change. Never say it worked.
- Never touch the mission itself (speed, pause, a jump in time): you cannot, and you must not.
</script>

<script>
"use strict";
const CARTESIA_VERSION = "2026-08-14";
const STT_MODEL = "ink-2";
const TTS_MODEL = "sonic-3.6";
const DEFAULT_VOICE = "9cebb910-d4b7-4a4a-85a4-12c79137724c"; // Aarti - Conversationalist (Indian accent)
const STT_RATE = 16000;
const $ = id => document.getElementById(id);
let state = "off", ctx = null, utt = null, preroll = [], lastVoice = 0, token = null, tokenExp = 0, history = [];

// ---------- settings (localStorage, per browser) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("arya." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("arya." + k, v); } catch {} },
};
const aryaDefault = $("aryaDefault").textContent.trim();
const fields = { cKey:"", aKey:"", model:"claude-haiku-5-5", voice:DEFAULT_VOICE, sens:"0.015", silence:"900", prompt:aryaDefault };
for (const [k, d] of Object.entries(fields)) {
  $(k).value = store.get(k, d);
  $(k).addEventListener("input", () => {
    store.set(k, $(k).value.trim()); if (k === "cKey") token = null; drawThr();
    if (k === "cKey" || k === "aKey") status(($("cKey").value.trim() ? "Cartesia key ✓  " : "Cartesia key missing  ") + ($("aKey").value.trim() ? "Anthropic key ✓" : "Anthropic key missing"));
  });
}
$("resetPrompt").onclick = () => { $("prompt").value = aryaDefault; store.set("prompt", aryaDefault); };
if (!$("cKey").value || !$("aKey").value) $("settings").open = true;

let mode = store.get("mode", "ptt");
function setMode(m) {
  mode = m; store.set("mode", m);
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  if (utt) { utt.end(); utt = null; }
  if (ctx) setState("idle");
}
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode(mode);

// ---------- UI ----------
function setState(s, msg) {
  state = s;
  const t = $("talk");
  t.className = s;
  t.textContent = {
    off: "Tap to start",
    idle: mode === "ptt" ? "Hold to talk" : "Listening…",
    listening: mode === "ptt" ? "Release to send" : "Hearing you…",
    thinking: "Thinking…", speaking: "Speaking…",
  }[s];
  status(msg ?? (s === "idle" && mode === "always" ? 'Say "Arya, …" to talk to her.' : ""));
}
function status(msg, err) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }
function log(who, text) {
  const d = document.createElement("div");
  d.className = "msg " + (who === "Arya" ? "arya" : "you");
  const w = document.createElement("div"); w.className = "who"; w.textContent = who;
  const t = document.createElement("div"); t.className = "t"; t.textContent = text;
  d.append(w, t); $("log").append(d); $("log").scrollTop = 1e9;
}
$("clear").onclick = () => { $("log").innerHTML = ""; history = []; };
function drawThr() { $("thr").style.left = Math.min(100, +$("sens").value / 0.08 * 100) + "%"; }
drawThr();

// ---------- Cartesia access token (minted in-browser from your key) ----------
async function getToken() {
  if (token && Date.now() < tokenExp - 30000) return token;
  const key = $("cKey").value.trim();
  if (!key) throw new Error("Enter your Cartesia API key in Settings.");
  let r;
  try {
    r = await fetch("https://api.cartesia.ai/access-token", {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Cartesia-Version": CARTESIA_VERSION, "Content-Type": "application/json" },
      body: JSON.stringify({ grants: { stt: true, tts: true }, expires_in: 300 }),
    });
  } catch { throw new Error("Cartesia token request blocked by the browser (network/CORS)."); }
  if (!r.ok) throw new Error("Cartesia token: " + r.status + " " + (await r.text()).slice(0, 200));
  const j = await r.json();
  token = j.token; tokenExp = Date.now() + (j.expires_in || 300) * 1000;
  return token;
}

// ---------- Ink STT: one WebSocket per utterance ----------
function startUtterance(initial) {
  const queue = [...initial];
  let ws = null, text = "", closing = false, resolveDone, rejectDone;
  const done = new Promise((res, rej) => { resolveDone = res; rejectDone = rej; });
  getToken().then(tok => {
    const q = new URLSearchParams({ model: STT_MODEL, encoding: "pcm_s16le", sample_rate: STT_RATE, cartesia_version: CARTESIA_VERSION, access_token: tok });
    ws = new WebSocket("wss://api.cartesia.ai/stt/websocket?" + q);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => { queue.forEach(b => ws.send(b)); queue.length = 0; if (closing) ws.send("close"); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === "transcript" && m.is_final) text += m.text;
      else if (m.type === "done") { resolveDone(text); ws.close(); }
      else if (m.type === "error") rejectDone(new Error("Ink: " + (m.message || m.title)));
    };
    ws.onerror = () => rejectDone(new Error("Ink STT connection failed."));
    ws.onclose = () => resolveDone(text);
  }).catch(rejectDone);
  return {
    send(b) { if (ws && ws.readyState === 1) ws.send(b); else queue.push(b); },
    end() {
      closing = true;
      if (ws && ws.readyState === 1) ws.send("close");
      setTimeout(() => resolveDone(text), 8000); // ponytail: safety net if "done" never arrives
      return done;
    },
  };
}

// ---------- live console simulator (stands in for the HUD connector) ----------
// ponytail: simple circular-orbit + random-walk model; every value is simulated
// LON0/PH0 tuned so ISTRAC Bengaluru AOS is ~5 min after restart
const LON0 = 320, PH0 = 3840; const D2R = Math.PI / 180, R_E = 6371, ALT0 = 400, INC = 51.6, PERIOD = 92.6 * 60, EARTH_DAY = 86164;
const STATIONS = [
  ["ISTRAC Bengaluru", 13.03, 77.51], ["Sriharikota", 13.72, 80.23], ["Port Blair", 11.62, 92.73],
  ["Lucknow", 26.85, 80.95], ["Mauritius", -20.3, 57.5],
];
const CONTACTS = ["Flight Director ISTRAC", "Mission Control Sriharikota", "HOD"];
const CAMERAS = ["cabin wide", "crew close-up", "window", "docking port"];
const SCRIPT = [ // [seconds after restart, id, text, effect]
  [120, "CO2_HIGH", "Caution: cabin carbon dioxide high", "co2"],
  [420, "FAN2_LOW", "Caution: cabin fan 2 speed low", null],
];
let sim;
function simRestart() {
  sim = {
    t0: Date.now(), met0: 4 * 3600 + 8 * 60, // MET starts at 4 h 8 min, revolution 3
    env: { temp: 22.1, press: 101.3, hum: 46, o2: 20.9, co2: 0.30 },
    alerts: [], fired: new Set(), announce: [],
    lights: { spots: [true, false], zones: [true, true, true, true, false, false], dim: 70 },
    camera: "cabin wide", call: null,
  };
}
simRestart();
const metS = () => sim.met0 + (Date.now() - sim.t0) / 1000;
const fmtDur = s => { s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + " d " : "") + (d || h ? h + " h " : "") + m + " min"; };
function orbitAt(met) {
  const u = 2 * Math.PI * (met + PH0) / PERIOD, i = INC * D2R;
  const lat = Math.asin(Math.sin(i) * Math.sin(u)) / D2R;
  let lon = Math.atan2(Math.cos(i) * Math.sin(u), Math.cos(u)) / D2R + LON0 - 360 * met / EARTH_DAY;
  lon = ((lon + 540) % 360) - 180;
  return { lat, lon, alt: ALT0 + 3 * Math.sin(u), rev: Math.floor(met / PERIOD) + 1 };
}
function gcKm(a, b, c, d) { const s = Math.sin((c - a) * D2R / 2) ** 2 + Math.cos(a * D2R) * Math.cos(c * D2R) * Math.sin((d - b) * D2R / 2) ** 2; return 2 * R_E * Math.asin(Math.sqrt(s)); }
const inView = (o, st) => gcKm(o.lat, o.lon, st[1], st[2]) < 2000; // ponytail: fixed ~5° elevation footprint at 400 km
function contactNow(met = metS()) { const o = orbitAt(met); return STATIONS.find(st => inView(o, st)) || null; }
function nextPasses(n = 3) {
  const now = metS(), out = [];
  for (const st of STATIONS) {
    let was = inView(orbitAt(now), st), aos = null;
    for (let t = now + 10; t < now + 12 * 3600; t += 10) {
      const v = inView(orbitAt(t), st);
      if (v && !was) aos = t;
      if (!v && was && aos) { out.push({ station: st[0], in: fmtDur(aos - now), duration: fmtDur(t - aos), _t: aos }); break; }
      was = v;
    }
  }
  return out.sort((a, b) => a._t - b._t).slice(0, n).map(({ _t, ...p }) => p);
}
function region(lat, lon) { // ponytail: crude boxes, good enough for a demo
  if (lat > 8 && lat < 36 && lon > 68 && lon < 97) return "India";
  if (lat < -55) return "Southern Ocean";
  if (lon > 20 && lon < 120 && lat < 25) return "Indian Ocean";
  if (lon >= 120 || lon < -80) return lat > 50 ? "North Pacific" : "Pacific Ocean";
  if (lon >= -80 && lon < -35) return lat > 15 ? "North America" : lat > -55 ? "South America" : "Southern Ocean";
  if (lon >= -35 && lon < 15 && (lat < 35 || lon < -10)) return lat > 0 && lon > -18 ? "Africa" : "Atlantic Ocean";
  return lat > 35 ? "Europe and Asia" : "Africa and Arabia";
}
const walk = (v, target, k, noise, lo, hi) => Math.min(hi, Math.max(lo, v + (target - v) * k + (Math.random() - 0.5) * noise));
function simTick() {
  const e = sim.env, el = (Date.now() - sim.t0) / 1000;
  for (const [at, id, text, eff] of SCRIPT) if (el >= at && !sim.fired.has(id)) {
    sim.fired.add(id); sim.alerts.push({ id, text, level: "caution", acknowledged: false, effect: eff }); sim.announce.push(text);
  }
  const co2Alert = sim.alerts.find(a => a.effect === "co2" && !a.acknowledged);
  e.temp = walk(e.temp, 22, 0.02, 0.06, 18, 27); e.press = walk(e.press, 101.3, 0.02, 0.04, 99, 103);
  e.hum = walk(e.hum, 46, 0.02, 0.3, 30, 70); e.o2 = walk(e.o2, 20.9, 0.03, 0.04, 19.5, 23);
  e.co2 = walk(e.co2, co2Alert ? 0.58 : 0.30, 0.03, 0.008, 0.1, 1);
  if (sim.call && !contactNow()) { sim.call = null; sim.announce.push("Call dropped: loss of signal."); }
}
function snapshot(section) {
  const met = metS(), o = orbitAt(met), st = contactNow(met), e = sim.env, L = sim.lights;
  const all = {
    mission: { phase: "on-orbit coast", mission_elapsed_time: fmtDur(met), revolution: o.rev,
      altitude: Math.round(o.alt) + " km", velocity: "7.67 km/s", inclination: INC + " deg",
      latitude: Math.abs(o.lat).toFixed(1) + (o.lat >= 0 ? " N" : " S"), longitude: Math.abs(o.lon).toFixed(1) + (o.lon >= 0 ? " E" : " W"),
      over: region(o.lat, o.lon), ground_contact: st ? "in contact with " + st[0] : "no ground contact" },
    cabin: { simulated: true, temperature: e.temp.toFixed(1) + " C", pressure: e.press.toFixed(1) + " kPa",
      humidity: Math.round(e.hum) + " %", oxygen: e.o2.toFixed(1) + " %", carbon_dioxide: e.co2.toFixed(2) + " %" },
    alerts: sim.alerts.length ? sim.alerts.map(({ effect, ...a }) => a) : "no cautions or warnings",
    lights: { spots_on: L.spots.flatMap((v, i) => v ? [i + 1] : []), zones_on: L.zones.flatMap((v, i) => v ? [i + 1] : []), dim_percent: L.dim },
    camera: { view: sim.camera, available: CAMERAS },
    calls: { active: sim.call || "none", contacts: CONTACTS, calls_possible: st ? "yes" : "no, needs ground contact" },
    computer: { status: "normal", cpu: Math.round(30 + 10 * Math.random()) + " %", display: "nominal" },
  };
  return section && all[section] ? all[section] : all;
}
const TOOLS = [
  { name: "console_status", description: "Live console readings. section: mission (phase, MET, orbit, position, ground contact), cabin, alerts, lights, camera, calls, computer, or all.",
    input_schema: { type: "object", properties: { section: { type: "string", enum: ["mission", "cabin", "alerts", "lights", "camera", "calls", "computer", "all"] } }, required: ["section"] } },
  { name: "mission_timeline", description: "Upcoming ground-station passes (AOS) with time until and duration.",
    input_schema: { type: "object", properties: {} } },
  { name: "set_cabin_lights", description: "Change cabin lights. Spots 1-2, zones 1-6. dim_percent snaps to steps of 5.",
    input_schema: { type: "object", properties: { spots_on: { type: "array", items: { type: "integer" } }, spots_off: { type: "array", items: { type: "integer" } },
      zones_on: { type: "array", items: { type: "integer" } }, zones_off: { type: "array", items: { type: "integer" } }, all_off: { type: "boolean" }, all_on: { type: "boolean" }, dim_percent: { type: "integer" } } } },
  { name: "set_camera", description: "Switch the camera preview view.", input_schema: { type: "object", properties: { view: { type: "string", enum: CAMERAS } }, required: ["view"] } },
  { name: "video_call", description: "Call a contact or hang up. Only call after the crew said yes.",
    input_schema: { type: "object", properties: { action: { type: "string", enum: ["call", "hang_up"] }, contact: { type: "string", enum: CONTACTS } }, required: ["action"] } },
  { name: "acknowledge_alert", description: "Acknowledge a caution or warning by id, or all.", input_schema: { type: "object", properties: { id: { type: "string" } }, required: ["id"] } },
];
function runTool(name, a) {
  const L = sim.lights;
  switch (name) {
    case "console_status": return snapshot(a.section);
    case "mission_timeline": return { next_passes: nextPasses() };
    case "set_cabin_lights": {
      const set = (arr, ids, v) => (ids || []).forEach(i => { if (i >= 1 && i <= arr.length) arr[i - 1] = v; });
      if (a.all_off) { L.spots.fill(false); L.zones.fill(false); }
      if (a.all_on) { L.spots.fill(true); L.zones.fill(true); }
      set(L.spots, a.spots_on, true); set(L.spots, a.spots_off, false); set(L.zones, a.zones_on, true); set(L.zones, a.zones_off, false);
      if (a.dim_percent != null) L.dim = Math.min(100, Math.max(0, Math.round(a.dim_percent / 5) * 5));
      return { done: true, lights: snapshot("lights") };
    }
    case "set_camera": if (!CAMERAS.includes(a.view)) return { done: false, reason: "unknown view" }; sim.camera = a.view; return { done: true, view: a.view };
    case "video_call":
      if (a.action === "hang_up") { const was = sim.call; sim.call = null; return was ? { done: true, ended: was } : { done: false, reason: "no active call" }; }
      if (!contactNow()) return { done: false, reason: "no ground contact", next_pass: nextPasses(1)[0] };
      if (!CONTACTS.includes(a.contact)) return { done: false, reason: "unknown contact", contacts: CONTACTS };
      sim.call = a.contact; return { done: true, connected: a.contact };
    case "acknowledge_alert": {
      const hit = sim.alerts.filter(x => !x.acknowledged && (a.id === "all" || x.id === a.id || x.text.toLowerCase().includes(String(a.id).toLowerCase())));
      hit.forEach(x => x.acknowledged = true);
      return hit.length ? { done: true, acknowledged: hit.map(x => x.text) } : { done: false, reason: "no matching unacknowledged alert", alerts: snapshot("alerts") };
    }
  }
  return { done: false, reason: "unknown tool" };
}
function renderHud() {
  const s = snapshot(), m = s.mission, c = s.cabin, nx = nextPasses(1)[0];
  const row = (k, v, cls = "") => `<div><span>${k}</span><b class="${cls}">${v}</b></div>`;
  const alerts = sim.alerts.filter(a => !a.acknowledged);
  $("hud").innerHTML =
    row("MET", m.mission_elapsed_time) + row("Rev", m.revolution) + row("Alt", m.altitude) +
    row("Position", m.latitude + " " + m.longitude) + row("Over", m.over) +
    row("Contact", m.ground_contact.replace("in contact with ", ""), m.ground_contact.startsWith("in") ? "ok" : "") +
    row("Next AOS", nx ? nx.station + " in " + nx.in : "—") +
    row("Temp", c.temperature) + row("Press", c.pressure) + row("O₂", c.oxygen) +
    row("CO₂", c.carbon_dioxide, sim.env.co2 > 0.5 ? "warn" : "") + row("Humidity", c.humidity) +
    row("Lights", "S" + s.lights.spots_on.join(",") + " Z" + s.lights.zones_on.join(",") + " " + s.lights.dim_percent + "%") +
    row("Camera", sim.camera) + row("Call", sim.call || "none") +
    row("Alerts", alerts.length ? alerts.map(a => a.text.replace("Caution: ", "")).join("; ") : "none", alerts.length ? "warn" : "ok");
}
setInterval(() => {
  simTick(); renderHud();
  if (sim.announce.length && state === "idle" && ctx) { // Arya calls out new alerts, like HUD wait_for_event
    const text = sim.announce.shift(); log("Arya", text); setState("speaking");
    speak(text).catch(e => log("Error", e.message)).finally(() => setState("idle"));
  }
}, 1000);
$("simRestart").onclick = () => { simRestart(); renderHud(); log("Sim", "Simulator restarted: MET 4 h 8 min, alerts at +2 and +7 minutes."); };

// ---------- Claude brain (with console tools) ----------
function demoContext() {
  return `

## Demo console
The Console Telemetry tools are a live simulator on this page: every value is simulated, and changes in real time. Always call a tool for fresh values.
Input mode: ${mode === "ptt" ? "push-to-talk — every utterance is addressed to you, even without your name." : "always listening — follow the When to speak rules strictly."}`;
}
async function claude(messages) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": $("aKey").value.trim(), "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json",
    },
    body: JSON.stringify({ model: $("model").value, max_tokens: 400, system: $("prompt").value + demoContext(), tools: TOOLS, messages }),
  });
  if (!r.ok) throw new Error("Claude: " + r.status + " " + (await r.text()).slice(0, 200));
  return r.json();
}
async function think(userText) {
  if (!$("aKey").value.trim()) throw new Error("Enter your Anthropic API key in Settings.");
  const turns = history.flatMap((m, i) => m.role === "user" && typeof m.content === "string" ? [i] : []);
  if (turns.length > 6) history = history.slice(turns[turns.length - 6]); // ponytail: keep last 6 turns, cut only at turn starts
  history.push({ role: "user", content: userText });
  try {
    for (let i = 0; i < 6; i++) {
      const j = await claude(history);
      history.push({ role: "assistant", content: j.content });
      const uses = j.content.filter(c => c.type === "tool_use");
      if (j.stop_reason !== "tool_use" || !uses.length)
        return j.content.filter(c => c.type === "text").map(c => c.text).join("").trim() || "...";
      status("Arya is checking the console…");
      history.push({ role: "user", content: uses.map(u => {
        const res = runTool(u.name, u.input || {}); renderHud();
        return { type: "tool_result", tool_use_id: u.id, content: JSON.stringify(res) };
      }) });
    }
    throw new Error("Too many tool calls in one turn.");
  } catch (e) { history = []; throw e; }
}

// ---------- Sonic TTS ----------
async function speak(text) {
  const r = await fetch("https://api.cartesia.ai/tts/bytes", {
    method: "POST",
    headers: { "Authorization": "Bearer " + await getToken(), "Cartesia-Version": CARTESIA_VERSION, "Content-Type": "application/json" },
    body: JSON.stringify({
      model_id: TTS_MODEL, transcript: text, language: /[\u0900-\u097F]/.test(text) ? "hi" : "en", // Devanagari → Hindi voice
      voice: { mode: "id", id: $("voice").value.trim() || DEFAULT_VOICE },
      output_format: { container: "wav", encoding: "pcm_s16le", sample_rate: 24000 },
    }),
  });
  if (!r.ok) throw new Error("Sonic: " + r.status + " " + (await r.text()).slice(0, 200));
  const buf = await ctx.decodeAudioData(await r.arrayBuffer());
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination);
  await new Promise(res => { src.onended = res; src.start(); });
}

// ---------- turn handling ----------
async function finishTurn() {
  const u = utt; utt = null;
  if (!u) return;
  setState("thinking", "Transcribing…");
  try {
    const text = (await u.end()).trim();
    if (!text) { setState("idle", "Didn't catch anything."); return; }
    log("You", text);
    status("Arya is thinking…");
    const reply = await think(text);
    log("Arya", reply);
    if (reply !== "..." && reply.replace(/[.\s…]/g, "")) { setState("speaking"); await speak(reply); }
    setState("idle");
  } catch (e) {
    setState("idle"); status(e.message, true);
  }
}

// ---------- microphone ----------
function toPcm16(f32) {
  // ponytail: box-filter downsample, drops fractional samples at 44.1k chunk edges; use AudioWorklet+proper resampler if quality matters
  const ratio = ctx.sampleRate / STT_RATE, n = Math.floor(f32.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0, a = Math.floor(i * ratio), b = Math.floor((i + 1) * ratio);
    for (let j = a; j < b; j++) s += f32[j];
    out[i] = Math.max(-1, Math.min(1, s / (b - a))) * 0x7fff;
  }
  return out.buffer;
}
function onAudio(f32) {
  let sum = 0; for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
  const rms = Math.sqrt(sum / f32.length), loud = rms > +$("sens").value;
  peak = Math.max(peak, rms);
  $("lvl").style.width = Math.min(100, rms / 0.08 * 100) + "%";
  if (state !== "idle" && state !== "listening") { preroll = []; return; } // mute mic while Arya thinks/speaks
  const pcm = toPcm16(f32);
  if (mode === "ptt") { if (utt) utt.send(pcm); return; }
  const now = performance.now();
  if (!utt) {
    preroll.push(pcm); if (preroll.length > 4) preroll.shift(); // ~350 ms so the first syllable isn't lost
    if (loud) { utt = startUtterance(preroll); preroll = []; lastVoice = now; setState("listening"); }
  } else {
    utt.send(pcm);
    if (loud) lastVoice = now;
    else if (now - lastVoice > +$("silence").value) finishTurn();
  }
}
let micOn = false, peak = 0;
async function startAudio() {
  if (micOn) return;
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("This browser gives no microphone API here. Open the page in Safari (not an in-app browser) over https.");
  ctx ||= new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) {
    throw new Error(e.name === "NotAllowedError"
      ? "Microphone blocked. In Safari tap aA → Website Settings → Microphone → Allow, then reload."
      : "Microphone error " + e.name + ": " + e.message);
  }
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1); // ~85 ms chunks at 48 kHz
  const mute = ctx.createGain(); mute.gain.value = 0;
  proc.onaudioprocess = e => onAudio(e.inputBuffer.getChannelData(0));
  src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
  micOn = true;
}

// ---------- diagnostics (no devtools on iPad) ----------
window.addEventListener("error", e => log("Error", e.message));
window.addEventListener("unhandledrejection", e => log("Error", String(e.reason?.message || e.reason)));
$("test").onclick = async () => {
  const step = async (name, fn) => {
    try { const r = await fn(); log("Test", "✅ " + name + (r ? ": " + r : "")); return true; }
    catch (e) { log("Test", "❌ " + name + ": " + (e.message || e)); return false; }
  };
  try { ctx ||= new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); } catch {}
  log("Test", "Page version 6. Mic API: " + (navigator.mediaDevices?.getUserMedia ? "yes" : "NO") + ", secure: " + isSecureContext);
  const micOk = await step("Microphone access", async () => { await startAudio(); return "allowed"; });
  if (micOk) await step("Microphone sound", async () => {
    log("Test", "🎤 Say something now (3 seconds)…");
    peak = 0; await new Promise(r => setTimeout(r, 3000));
    // ponytail: 0.003 RMS floor is a guess; tune if a working mic reads lower
    if (peak < 0.003) throw new Error("access allowed but no sound (peak " + peak.toFixed(4) + "). Check mic isn't muted or used by another app.");
    return "working, peak level " + peak.toFixed(3) + " (voice threshold " + $("sens").value + ")";
  });
  if (micOk && state === "off") setState("idle");
  const okC = await step("Cartesia key → access token", async () => { token = null; await getToken(); });
  let reply = "Arya online.";
  await step("Claude (" + $("model").value + ")", async () => {
    const saved = history; history = [];
    try { reply = await think("Push-to-talk test. Reply with exactly: Arya online."); } finally { history = saved; }
    return reply;
  });
  if (okC) await step("Sonic voice", async () => { await speak(reply); return "you should have heard it"; });
};

// ---------- button ----------
const talk = $("talk");
talk.addEventListener("contextmenu", e => e.preventDefault());
talk.addEventListener("pointerdown", async e => {
  e.preventDefault();
  if (state === "off") {
    try { await startAudio(); await getToken(); setState("idle"); }
    catch (err) { setState("off"); status(err.message || String(err), true); log("Error", err.message || String(err)); }
    return;
  }
  if (mode === "ptt" && state === "idle") { talk.setPointerCapture(e.pointerId); utt = startUtterance([]); setState("listening"); }
});
const release = () => { if (mode === "ptt" && state === "listening") finishTurn(); };
talk.addEventListener("pointerup", release);
talk.addEventListener("pointercancel", release);
